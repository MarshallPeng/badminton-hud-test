[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "badminton-hud"
version = "0.1.0"
description = "Adds a game-style HUD to a single-rally badminton clip"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python-headless",
    "pillow",
    "ultralytics",
    "lap",
]

[project.scripts]
hud = "badminton_hud.cli:main"

[tool.setuptools]
packages = ["badminton_hud"]

[tool.setuptools.package-data]
badminton_hud = ["fonts/*.ttf"]
